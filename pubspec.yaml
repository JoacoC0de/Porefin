name: finanzas_rapidas
description: App de finanzas personales rápidas
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  fl_chart: ^0.66.0
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  cupertino_icons: ^1.0.6
  home_widget: ^0.7.0
  excel: ^4.0.6
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  flutter_local_notifications: ^17.1.2
  workmanager: ^0.10.9
  permission_handler: ^11.3.1
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "iconoApp.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - iconoApp.jpeg

